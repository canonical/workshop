summary: Run LXD integration tests for workshop exec

execute: |
  rm -rf cover
  mkdir -m 777 cover

  sudo -u ubuntu 2>&1 -- go test -cover "$SPREAD_PATH"/internal/workshop/lxd/tests/integration -timeout=30m -tags=integration -check.v -check.f wsExec -coverpkg=github.com/canonical/workshop/internal/workshop/lxd -args -test.gocoverdir="$PWD"/cover

artifacts:
  - cover
