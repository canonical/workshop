summary: Test launch for the supported workshop bases
environment:
  BASE/ctr20,vm20: ubuntu@20.04
  BASE/ctr22,vm22: ubuntu@22.04
  BASE/ctr24,vm24: ubuntu@24.04
  BASE/ctr26,vm26: ubuntu@26.04
  CONFINEMENT/ctr20,ctr22,ctr24,ctr26: container
  CONFINEMENT/vm20,vm22,vm24,vm26: virtual-machine
prepare: |
  timedatectl set-timezone Pacific/Auckland
restore: |
  . "$TESTSLIB"/utils.sh
  timedatectl set-timezone Etc/UTC
  workshop_exec remove || true
debug: |
  lxc storage info workshop
execute: |
  . "$TESTSLIB"/utils.sh

  echo "Test launch for $BASE ${CONFINEMENT}s"
  envsubst '${BASE}${CONFINEMENT}' < workshop.yaml.in > workshop.yaml
  chown ubuntu:ubuntu workshop.yaml
  lxc storage info workshop || true
  workshop_exec launch ws
  workshop_exec list | MATCH 'ws[[:space:]]*Ready[[:space:]]*-'

  # ensure user idmap is applied
  rm -f build-artifact
  workshop_exec exec ws touch build-artifact
  stat --format='%U %G' build-artifact | MATCH '^ubuntu ubuntu$'
  workshop_exec exec ws sudo chown 0:0 build-artifact
  stat --format='%u %g' build-artifact | MATCH '^1000000 1000000$'
  workshop_exec exec ws sudo chown 1001:1001 build-artifact
  stat --format='%u %g' build-artifact | MATCH '^1001001 1001001$'

  # ensure the workshop has a socket for workshopctl
  if [ "$CONFINEMENT" = container ]; then
    workshop_exec exec ws test -S /var/lib/workshop/run/workshop.socket.untrusted
  fi

  # ensure the apt cache is mounted
  workshop_exec exec ws mountpoint /var/cache/apt/archives
  workshop_exec exec ws stat --format='%A %U %G' /var/cache/apt/archives | MATCH '^drwxr-xr-x workshop workshop$'

  # ensure apt is configured to exclude suggested and recommended packages
  workshop_exec run ws check-apt

  # ensure systemd-resolved is configured for the workshopbr0 network
  resolvectl domain workshopbr0 | MATCH '^Link [0-9]+ \(workshopbr0\): ~wp$'
  resolvectl query "ws-$(< .workshop.lock).wp" | MATCH 'link: workshopbr0'
  resolvectl query --type=CNAME "ws.$(< .workshop.lock).wp" | MATCH "IN CNAME ws-$(< .workshop.lock).wp"
  resolvectl query --type=CNAME 'ws.launch.wp' | MATCH "IN CNAME ws-$(< .workshop.lock).wp"

  # ensure systemd-networkd is configured not to release DHCP on stop
  # just skip if `networkctl cat` is missing, since old bases have been manually tested
  function extract_section() {
    awk --assign title="[$1]" '/\[/ {p=0} $0 == title {p=1; next} p'
  }
  sd_ver="$(workshop_exec exec ws networkctl --version | awk 'FNR == 1 {print $2}')"
  if [ "$sd_ver" -ge 254 ]; then
    workshop_exec exec ws sudo networkctl cat @eth0 > eth0.log
    extract_section DHCPv4 < eth0.log | MATCH '^SendRelease=false$'
    extract_section DHCPv6 < eth0.log | MATCH '^SendRelease=false$'
  fi

  # ensure timezone is inherited from host
  workshop_exec exec ws timedatectl show | MATCH '^Timezone=Pacific/Auckland$'
