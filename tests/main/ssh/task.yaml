summary: OpenSSH is configured for automatic access to workshops

environment:
  RUNTIME/ctr: lxd-container
  RUNTIME/vm: lxd-vm

prepare: |
  . "$TESTSLIB"/utils.sh
  envsubst '${RUNTIME}' < workshop.yaml.in > workshop.yaml
  chown ubuntu:ubuntu workshop.yaml
  workshop_exec launch ws-ssh

  snap pack test-ssh-client --filename=test-ssh-client.snap
  snap install --dangerous test-ssh-client.snap
  snap connect test-ssh-client:ssh-keys
restore: |
  . "$TESTSLIB"/utils.sh
  workshop_exec remove ws-ssh
  snap remove --purge test-ssh-client || true
  rm -f test-ssh-client.snap
execute: |
  . "$TESTSLIB"/utils.sh

  ssh_exec() {
    sudo -u ubuntu -- ssh -o BatchMode=yes -o ConnectTimeout=5 "$@"
  }

  pid="$(< .workshop.lock)"
  hostname="ws-ssh-$pid.wp"
  friendly="ws-ssh.$pid.wp"
  friendlier="ws-ssh.ssh.wp"

  echo "Check config is scoped to *.wp hosts"
  sudo -u ubuntu -- ssh -G "$friendly" | MATCH '^user workshop$'
  sudo -u ubuntu -- ssh -G example.invalid | MATCH '^user ubuntu$'

  echo "Check we can connect automatically"
  ssh_exec "$hostname" -- hostname | MATCH '^ws-ssh$'
  ssh_exec "$friendly" -- id -un | MATCH '^workshop$'
  ssh_exec "$friendlier" -- true

  echo "Check certificates are scoped to single principal"
  ! ssh_exec -o HostKeyAlias=example.invalid "$friendly" -- true || false
  ! ssh_exec "ubuntu@$hostname" -- true || false

  confined_ssh() {
    sudo -u ubuntu -H -- test-ssh-client.ssh "$@"
  }

  echo "Check confined snaps cannot read the workshop SSH config"
  literal=/var/snap/test-ssh-client/common/literal.conf
  echo "Include /var/snap/workshop/common/workshop/ssh/ssh_config.d/workshop.conf" > "$literal"
  confined_ssh -F "$literal" -G example.invalid 2>&1 | MATCH 'Permission denied'

  echo "Check confined snaps can still parse the system SSH config"
  confined_ssh -G example.invalid | MATCH '^user ubuntu$'
