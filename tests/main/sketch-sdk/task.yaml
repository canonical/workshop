summary: Check workshop sketch-sdk
prepare: |
  . "$TESTSLIB"/utils.sh
  workshop_exec launch
restore: |
  . "$TESTSLIB"/utils.sh
  workshop_exec remove
execute: |
  . "$TESTSLIB"/utils.sh

  echo "Install empty sketch SDK"
  sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  q
  EOF

  workshop_exec info | yq '.sdks["sketch"].tracking' | MATCH '^~/.local/share/workshop/id/.*/ws-sketch/sdk/sketch'
  workshop_exec info | yq '.sdks["sketch"].installed' | MATCH '\(x1\)$'

  echo "Reject unknown sketch SDK YAML fields"
  ! sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk > error.log 2>&1 <<EOF || false
  1/^name: sketch$/a
  bass: ubuntu@22.04
  .
  wq
  EOF
  MATCH 'cannot sketch: invalid "sketch" SDK: sketch SDK YAML contains unknown fields: "bass" at line [0-9]+, column [0-9]+' < error.log

  echo "Restore valid sketch SDK YAML"
  sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  /^bass: ubuntu@22.04$/d
  wq
  EOF

  echo "Stash current sketch SDK"
  workshop_exec sketch-sdk --stash
  workshop_exec info | yq '.sdks["sketch"].installed' | NOMATCH '\(x1\)$'

  echo "Restore sketch SDK"
  workshop_exec sketch-sdk --restore
  workshop_exec info | yq '.sdks["sketch"].installed' | MATCH '\(x1\)$'

  echo "Add setup-base"
  sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  1/^    # apt-get update$/c
      mkdir -p /home/workshop/ws-sketch-test
  .
  wq
  EOF

  workshop_exec info | yq '.sdks["sketch"].installed' | MATCH '\(x2\)$'

  echo "Check refresh is not run if no updates to the sketch"
  output="$(sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  q
  EOF
  )"
  [ -z "$output" ]
  workshop_exec info | yq '.sdks["sketch"].installed' | MATCH '\(x2\)$'


  echo "Add a new mount"
  sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  1/^plugs:$/a
    sketch-plug:
      interface: mount
      workshop-target: /home/workshop/ws-sketch-test
  .
  wq
  EOF

  workshop_exec info | yq '.sdks["sketch"].installed' | MATCH '\(x3\)$'
  workshop_exec connections ws-sketch | MATCH "*.ws-sketch/sketch:sketch-plug.*:mount"
  workshop_exec exec -- mountpoint /home/workshop/ws-sketch-test

  echo "Remove the sketch"
  workshop_exec sketch-sdk --remove

  echo "Install empty sketch SDK"
  sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  q
  EOF

  echo "Add a breaking change to sketch"
  ! sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF || false
  1/^    # uv sync$/c
      false  # fail on purpose
  .
  wq
  EOF

  echo "Fix the breaking change"
  sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF
  %s/false  # fail/true  # succeed/
  wq
  EOF

  echo "Add another breaking change to sketch"
  ! sudo TERM=ansi EDITOR=ex -u ubuntu -- workshop sketch-sdk <<EOF || false
  %s/true  # succeed/false  # break/
  wq
  EOF

  echo "Abort the change"
  workshop_exec refresh --abort

  echo "Eject the sketch"
  workshop_exec sketch-sdk --eject --name broken
  [ -f .workshop/broken/sdk.yaml ]
