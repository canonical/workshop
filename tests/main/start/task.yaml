summary: Check workshop start

environment:
  CONFINEMENT/ctr: container
  CONFINEMENT/vm: virtual-machine

prepare: |
  . "$TESTSLIB"/utils.sh
  envsubst '${CONFINEMENT}' < workshop.yaml.in > workshop.yaml
  # TODO: remove the next line once VMs support SDKs
  [ "${CONFINEMENT}" = container ] || (head --lines=-2 workshop.yaml | sponge workshop.yaml)
  chown ubuntu:ubuntu workshop.yaml
  workshop_exec launch
restore: |
  . "$TESTSLIB"/utils.sh
  workshop_exec remove
execute: |
  . "$TESTSLIB"/utils.sh

  workshop_exec stop

  echo "Check the workshop is in Stopped state"
  workshop_exec list | MATCH "^ws-start[[:space:]]+Stopped[[:space:]]+-$"

  echo "Start the workshop"
  workshop_exec start

  echo "Check the workshop is in Ready state"
  workshop_exec list | MATCH "^ws-start[[:space:]]+Ready[[:space:]]+-$"

  echo "Check the workshop also becomes Ready when systemd boots degraded"
  workshop_exec exec -- sudo cp /project/workshop-test-degraded.service /etc/systemd/system/
  workshop_exec exec -- sudo systemctl enable workshop-test-degraded.service
  workshop_exec stop
  workshop_exec start
  workshop_exec list | MATCH "^ws-start[[:space:]]+Ready[[:space:]]+-$"
  workshop_exec exec -- systemctl is-system-running | MATCH '^degraded$'
