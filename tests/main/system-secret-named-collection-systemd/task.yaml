# Checks that a slot selecting a named (non-default) keyring collection
# resolves the secret through the workshop secret socket. The secret is stored
# in a collection that is not the Secret Service default collection, so the
# provider must look it up by name rather than through the "default" alias.
summary: Check the system SDK serves a secret from a named collection
prepare: |
  . "$TESTSLIB"/utils.sh
  . "$TESTSLIB"/secret-service.sh

  install_secret_service
  start_secret_service

  # Build the consumer SDK and publish it to the local try area.
  TESTROOT=$(pwd)
  rm -rf ~ubuntu/secret-consumer
  cp -r "$TESTROOT/sdk" ~ubuntu/secret-consumer
  chown -R ubuntu:ubuntu ~ubuntu/secret-consumer
  (cd ~ubuntu/secret-consumer && run_sdkcraft try)

  workshop_exec launch ws-system-secret-named-systemd
restore: |
  . "$TESTSLIB"/utils.sh
  . "$TESTSLIB"/secret-service.sh

  workshop_exec remove ws-system-secret-named-systemd || true
  rm -rf ~ubuntu/secret-consumer
  stop_secret_service
execute: |
  . "$TESTSLIB"/utils.sh
  . "$TESTSLIB"/secret-service.sh

  echo "Check a secret in a named collection is served to the system SDK slot"
  store_secret_in_collection workshop-named workshop-secret-value \
      service workshop account demo
  # The try SDK is registered under its stripped name, so connect with
  # "secret-consumer" rather than the "try-secret-consumer" workshop name.
  workshop_exec connect \
      ws-system-secret-named-systemd/secret-consumer:api-key \
      ws-system-secret-named-systemd/system:api-key

  echo "Check the SDK systemd unit receives the secret"
  workshop_exec exec ws-system-secret-named-systemd -- \
      sudo systemctl restart secret-consumer.service
  workshop_exec exec ws-system-secret-named-systemd -- \
      sudo cat /run/secret-consumer.out > secret.out
  MATCH '^workshop-secret-value$' < secret.out
