summary: Ensure that workshop autostart behavior performs correctly
debug: |
  resolvectl status workshopbr0 || true
  systemctl status sys-subsystem-net-devices-workshopbr0.device || true
  systemctl status snap.workshop.configure-dns.service || true
  journalctl -xeu snap.workshop.configure-dns.service || true
prepare: |
  . "$TESTSLIB"/utils.sh
  workshop_exec launch
restore: |
  . "$TESTSLIB"/utils.sh
  workshop_exec remove
execute: |
  . "$TESTSLIB"/utils.sh

  check_dns() {
    resolvectl query "ws-autostart-$(< .workshop.lock).wp" | MATCH 'link: workshopbr0'
  }

  echo "Make sure a running workshop automatically starts after reboot"
  if [ $SPREAD_REBOOT = 0 ]; then
    REBOOT
  fi
  if [ $SPREAD_REBOOT = 1 ]; then
    lxd waitready
    workshop_exec list | MATCH 'Ready'
    retry 3 check_dns
  fi

  echo "Make sure a workshop can start independently of the workshop daemon"
  if [ $SPREAD_REBOOT = 1 ]; then
    REBOOT
  fi
  if [ $SPREAD_REBOOT = 2 ]; then
    lxd waitready
    filter="name=ws-autostart-$(< .workshop.lock)"
    lxc list --format csv --columns s --project workshop.ubuntu "$filter" | MATCH '^RUNNING|READY$'
    ! systemctl is-active snap.workshop.workshopd.service || false
    retry 3 check_dns
  fi

  echo "Make sure a stopped workshop remains stopped after reboot"
  workshop_exec stop ws-autostart
  if [ $SPREAD_REBOOT = 2 ]; then
    REBOOT
  fi
  workshop_exec list | MATCH 'Stopped'
