summary: Ensure that launch for multiple workshops works correctly
restore: |
  . "$TESTSLIB"/utils.sh
  # TODO: remove simultaneously once LXD 6.10 is available. Currently VMs hold
  # a reference to all mounted filesystems, so have to be removed before the
  # container filesystems can be removed (unless ws-two is launched first).
  workshop_exec remove ws-two
  workshop_exec remove ws-one ws-three
execute: |
  . "$TESTSLIB"/utils.sh

  echo "Check workshop can be launched with a basic SDK"
  workshop_exec launch ws-one ws-two ws-three
  workshop_exec list | MATCH "ws-one[[:space:]]*Ready[[:space:]]*-"
  workshop_exec list | MATCH "ws-two[[:space:]]*Ready[[:space:]]*-"
  workshop_exec list | MATCH "ws-three[[:space:]]*Ready[[:space:]]*-"

  # ensure workshops can resolve each other by name
  mkdir -p srv/qwertyuiop
  workshop_exec exec ws-one -- systemd-run --user --working-directory=/project/srv -- python3 -m http.server 8877
  workshop_exec exec ws-two -- curl http://ws-one:8877 | MATCH qwertyuiop
  workshop_exec exec ws-two -- systemd-run --user --working-directory=/project/srv -- python3 -m http.server 7788
  workshop_exec exec ws-one -- curl http://ws-two:7788 | MATCH qwertyuiop
