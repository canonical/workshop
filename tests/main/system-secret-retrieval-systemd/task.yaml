# Checks that a secret reaches a systemd unit through the workshop secret
# socket. An SDK hook installs a LoadCredential unit, matching how SDK
# systemd services consume secrets, and the unit reads the resolved secret
# from its credentials directory.
summary: Check the system SDK serves a secret to a systemd unit
prepare: |
  . "$TESTSLIB"/utils.sh
  . "$TESTSLIB"/secret-service.sh

  install_secret_service
  start_secret_service

  # Build the consumer SDK and publish it to the local try area.
  TESTROOT=$(pwd)
  rm -rf ~ubuntu/secret-consumer
  cp -r "$TESTROOT/sdk" ~ubuntu/secret-consumer
  chown -R ubuntu:ubuntu ~ubuntu/secret-consumer
  (cd ~ubuntu/secret-consumer && run_sdkcraft try)

  workshop_exec launch ws-system-secret-systemd
restore: |
  . "$TESTSLIB"/utils.sh
  . "$TESTSLIB"/secret-service.sh

  workshop_exec remove ws-system-secret-systemd || true
  rm -rf ~ubuntu/secret-consumer
  stop_secret_service
execute: |
  . "$TESTSLIB"/utils.sh
  . "$TESTSLIB"/secret-service.sh

  echo "Check a secret in the host keyring is served to the system SDK slot"
  store_secret workshop-secret-value service workshop account demo
  # The try SDK is registered under its stripped name, so connect with
  # "secret-consumer" rather than the "try-secret-consumer" workshop name.
  workshop_exec connect \
      ws-system-secret-systemd/secret-consumer:api-key \
      ws-system-secret-systemd/system:api-key

  echo "Check the SDK systemd unit receives the secret"
  workshop_exec exec ws-system-secret-systemd -- \
      sudo systemctl restart secret-consumer.service
  workshop_exec exec ws-system-secret-systemd -- \
      sudo cat /run/secret-consumer.out > secret.out
  MATCH '^workshop-secret-value$' < secret.out
