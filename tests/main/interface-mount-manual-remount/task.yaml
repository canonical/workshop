# Checks that a manually connected mount plug keeps its remount and its manual
# status across a refresh, both when its workshop-target is unchanged and when
# it changes.
summary: Check a manual mount connection keeps its remount across a refresh
prepare: |
  . "$TESTSLIB"/utils.sh
  workshop_exec launch ws-mount-remount
restore: |
  . "$TESTSLIB"/utils.sh
  workshop_exec remove ws-mount-remount
  rm -rf /home/ubuntu/remount-source
  # The remount warns when it creates its new source; acknowledge it so it does
  # not leak into later tests' warning counts.
  workshop_exec warnings
  workshop_exec okay || true
execute: |
  . "$TESTSLIB"/utils.sh

  echo "Check the manual connection is established"
  # The mount plug auto-connects to the host mount slot, so disconnect it and
  # connect it manually to get a manual connection we can remount.
  workshop_exec disconnect ws-mount-remount/test-sdk-mount:data
  workshop_exec connect ws-mount-remount/test-sdk-mount:data :mount
  workshop_exec connections ws-mount-remount |
      MATCH "^mount.+ws-mount-remount/test-sdk-mount:data.+ws-mount-remount/system:mount.+manual$"

  echo "Remount the manual connection"
  new_source="/home/ubuntu/remount-source"
  workshop_exec remount ws-mount-remount/test-sdk-mount:data "$new_source"
  workshop_exec info | yq '.sdks["test-sdk-mount"].mounts["data"]' |
      MATCH "^host-source:.*~/remount-source"

  echo "Refresh without changing the mount definition"
  # A no-op refresh reports "no updates available" and skips the reconnect
  # logic, so change the SDK channel to force a real refresh. The mount plug
  # definition is unchanged.
  sed -i 's/channel: stable/channel: edge/' .workshop.yaml
  workshop_exec refresh ws-mount-remount | MATCH 'refreshed$'
  workshop_exec connections ws-mount-remount |
      MATCH "^mount.+ws-mount-remount/test-sdk-mount:data.+ws-mount-remount/system:mount.+manual$"
  workshop_exec info | yq '.sdks["test-sdk-mount"].mounts["data"]' |
      MATCH "^host-source:.*~/remount-source"

  echo "Change the mount target and refresh"
  sed -i 's|workshop-target: /mnt/data|workshop-target: /mnt/data2|' .workshop.yaml
  workshop_exec refresh ws-mount-remount | MATCH 'refreshed$'
  workshop_exec connections ws-mount-remount |
      MATCH "^mount.+ws-mount-remount/test-sdk-mount:data.+ws-mount-remount/system:mount.+manual$"
  workshop_exec info | yq '.sdks["test-sdk-mount"].mounts["data"]' |
      MATCH "^host-source:.*~/remount-source"
  workshop_exec exec ws-mount-remount -- mountpoint -q /mnt/data2
