summary: Check workshop stop

environment:
  RUNTIME/ctr: lxd-container
  RUNTIME/vm: lxd-vm

prepare: |  
  . "$TESTSLIB"/utils.sh
  envsubst '${RUNTIME}' < workshop.yaml.in > workshop.yaml
  chown ubuntu:ubuntu workshop.yaml
  workshop_exec launch
restore: |
  . "$TESTSLIB"/utils.sh
  workshop_exec remove
execute: |
  . "$TESTSLIB"/utils.sh

  echo "Stop the workshop"
  workshop_exec stop

  echo "Check the workshop is in Stopped state"
  workshop_exec list | MATCH "^ws-stop[[:space:]]+Stopped[[:space:]]+-$"

  echo "Check stopping the Stopped workshop does not result in error"
  workshop_exec stop

  echo "Check the workshop is in Stopped state"
  workshop_exec list | MATCH "^ws-stop[[:space:]]+Stopped[[:space:]]+-$"
