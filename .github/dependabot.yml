version: 2
updates:
  # docs/requirements.txt is generated by
  # .github/workflows/update-sphinx-stack.yaml from the canonical/sphinx-stack
  # requirements plus docs/requirements.in. Any per-line bump landed here is
  # overwritten by the next weekly sync.
  #
  # This block governs pull requests only. Dependabot alerts are a separate
  # lane, configured in repository settings, and nothing in this file affects
  # them.
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
