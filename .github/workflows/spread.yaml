name: Workshop end-to-end tests
on:
  workflow_call:
    inputs:
      lxd_channel:
        description: LXD snap channel to use
        type: string
        default: 6/stable
    secrets:
      STORE_CREDENTIALS:
        required: false
      SDKCRAFT_STORE_CREDENTIALS:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deps:
    uses: ./.github/workflows/build-deps.yaml
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
  snap-tests:
    name: snap tests / ${{ matrix.suite.label }}
    needs: [build-deps]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-64]
        suite:
          # Core workshop scenarios.
          - name: main-launch
            label: main / launch
            paths: >-
              tests/main/autostart
              tests/main/compatible-backend
              tests/main/firewall-docker
              tests/main/launch
              tests/main/launch-abort
              tests/main/launch-continue
              tests/main/launch-multiple
              tests/main/launch-sdk
          - name: main-lifecycle
            label: main / lifecycle
            paths: >-
              tests/main/refresh
              tests/main/refresh-abort
              tests/main/refresh-conflict
              tests/main/refresh-continue
              tests/main/remount
              tests/main/remove
              tests/main/remove-snap
              tests/main/restart-connections
              tests/main/restore
              tests/main/start
              tests/main/start-conflict
              tests/main/stop
              tests/main/stop-conflict
          - name: main-interfaces
            label: main / interfaces
            paths: >-
              tests/main/connect
              tests/main/connections
              tests/main/disconnect
              tests/main/exec
              tests/main/interface-camera
              tests/main/interface-custom-device
              tests/main/interface-desktop
              tests/main/interface-gpu
              tests/main/interface-mount
              tests/main/interface-plug-binding
              tests/main/interface-ssh-agent
              tests/main/interface-tunnel
              tests/main/shell
              tests/main/ssh
              tests/main/workshop-connections
          - name: main-status-sdk
            label: main / status and SDKs
            paths: >-
              tests/main/changes
              tests/main/check-health
              tests/main/completion
              tests/main/info-sdk-health
              tests/main/integrity-checks
              tests/main/list
              tests/main/list-global
              tests/main/project-sdks
              tests/main/sdk-find
              tests/main/sdk-info
              tests/main/sdk-multi-user-mount
              tests/main/sketch-sdk
              tests/main/try-sdks
          # Documentation scenarios.
          - name: docs-how-to
            label: docs / how-to
            paths: tests/docs-how-to/
          - name: docs-tutorial-part-1
            label: docs / tutorial part 1
            paths: tests/docs-tutorial/part-1
          - name: docs-tutorial-part-2
            label: docs / tutorial part 2
            paths: tests/docs-tutorial/part-2
          - name: docs-tutorial-part-3
            label: docs / tutorial part 3
            paths: tests/docs-tutorial/part-3
          - name: docs-tutorial-part-4
            label: docs / tutorial part 4
            paths: tests/docs-tutorial/part-4
          # Lower-level LXD integration scenarios.
          - name: integration
            label: integration
            paths: tests/integration/
    runs-on: [self-hosted, linux, jammy, x64, xlarge]
    steps:
      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: ${{ inputs.lxd_channel || '6/stable' }}
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout Workshop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Download Workshop Snap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap_workshop
          path: ${{ github.workspace }}/tests/
      - name: Download spread binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spread_binary
          path: /usr/local/bin
      - name: Install spread
        run: sudo chmod +x /usr/local/bin/spread
      - name: Set LXD storage size
        run: |
          lxc profile device set default root size=32GiB
      - name: Run spread
        env:
          SUITE_PATHS: ${{ matrix.suite.paths }}
          LXD_CHANNEL: ${{ inputs.lxd_channel || '6/stable' }}
        run: |
          mkdir ${{ github.workspace }}.cover
          read -r -a suite_paths <<< "$SUITE_PATHS"
          spread -artifacts=${{ github.workspace }}.cover "${suite_paths[@]}"
      - name: Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage-${{ matrix.suite.name }}
          path: ${{ github.workspace }}.cover/lxd:ubuntu-24.04:tests/
          if-no-files-found: ignore
  publish:
    needs: [build-deps, snap-tests]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap_workshop
      - uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: github.event_name == 'push'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_CREDENTIALS }} # zizmor: ignore[secrets-outside-env]
        with:
          snap: ${{ needs.build-deps.outputs.snap_workshop }}
          release: edge
      - uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: github.event_name == 'pull_request'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_CREDENTIALS }} # zizmor: ignore[secrets-outside-env]
        with:
          snap: ${{ needs.build-deps.outputs.snap_workshop }}
          release: edge/${{ github.event.pull_request.number }}
      - name: Download arm64 snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap_workshop_arm64
      - uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: github.event_name == 'push'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_CREDENTIALS }} # zizmor: ignore[secrets-outside-env]
        with:
          snap: ${{ needs.build-deps.outputs.snap_workshop_arm64 }}
          release: edge
      - uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: github.event_name == 'pull_request'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_CREDENTIALS }} # zizmor: ignore[secrets-outside-env]
        with:
          snap: ${{ needs.build-deps.outputs.snap_workshop_arm64 }}
          release: edge/${{ github.event.pull_request.number }}
