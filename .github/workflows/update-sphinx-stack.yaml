name: Update Sphinx Stack

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Mondays

permissions:
  contents: write
  pull-requests: write

jobs:
  update-sphinx-stack:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Checkout Sphinx Stack repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical/sphinx-stack
          path: sphinx-stack-temp
          persist-credentials: false

      - name: Update Sphinx Stack files
        run: |
          # Clean up any previous installation
          make -C docs clean
          rm -rf docs/{Makefile,_dev}

          # Copy the Makefile and _dev directory to the project's docs directory.
          # Stack-managed files only — conf.py, .gitignore, .readthedocs.yaml,
          # _templates/, redirects.txt remain project-managed.
          cp -a sphinx-stack-temp/docs/{Makefile,_dev} docs/

          # Assemble the docs requirements: upstream Sphinx Stack constraints
          # first, then Workshop-specific additions. This is deliberately not a
          # compiled lockfile. Pinning the full transitive closure puts every
          # upstream sub-dependency into the repository dependency graph, which
          # generates Dependabot alerts and Trivy findings for packages that
          # Workshop neither ships nor controls.
          {
            printf '# Generated by .github/workflows/update-sphinx-stack.yaml. Do not edit.\n'
            printf '# Sources: canonical/sphinx-stack docs/requirements.txt, docs/requirements.in\n\n'
            cat sphinx-stack-temp/docs/requirements.txt
            printf '\n'
            cat docs/requirements.in
          } > docs/requirements.txt.new
          mv docs/requirements.txt.new docs/requirements.txt

          # Get the latest commit hash from the Sphinx Stack
          cd sphinx-stack-temp
          SPHINX_STACK_COMMIT=$(git rev-parse --short HEAD)
          echo "SPHINX_STACK_COMMIT=$SPHINX_STACK_COMMIT" >> $GITHUB_ENV
          cd ..

          # Clean up the temporary checkout
          rm -rf sphinx-stack-temp

          echo "Sphinx Stack files updated successfully"

      - name: Install documentation dependencies
        run: make -C docs install

      - name: Check for changes, commit, and create PR if any
        run: |
          if git diff --exit-code; then
            echo "No changes detected, skipping commit and PR creation."
          else
            pr_branch="docs/update-sphinx-stack-${SPHINX_STACK_COMMIT}-$(date +'%Y%m%d%H%M%S')"
            git checkout -b $pr_branch

            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'

            git add .
            git commit -m "Update Sphinx Stack files"
            git push --set-upstream origin $pr_branch

            gh pr create --title "Update Sphinx Stack files" --body "This PR updates the Sphinx Stack files from the upstream repository (canonical/sphinx-stack)." --base main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
